<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fearlessly Forward Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F3F5; --ink:#101828; --muted:#5B6577; --rule:#D3D8E0; --accent:#2B3FE0;
  --serif:"Instrument Serif","Iowan Old Style","Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C111B; --ink:#EEF1F6; --muted:#98A2B5; --rule:#263042; --accent:#8FA2FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C111B; --ink:#EEF1F6; --muted:#98A2B5; --rule:#263042; --accent:#8FA2FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:clamp(40px,9vw,112px) clamp(22px,5vw,56px) clamp(48px,8vw,96px)}

header{margin-bottom:clamp(28px,5vw,56px)}
h1{
  font-family:var(--serif);font-weight:400;margin:0;
  font-size:clamp(1.3rem,6.6vw,3.4rem);line-height:1.05;white-space:nowrap;letter-spacing:-.02em;
}
h1 .second{font-style:italic}
.path{position:relative;height:1px;margin-top:clamp(28px,4vw,48px);background:var(--rule);overflow:hidden}
.path::after{
  content:"";position:absolute;inset:0 auto 0 0;width:100%;background:var(--accent);
  transform-origin:left;animation:go 1.6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes go{from{transform:scaleX(0)}to{transform:scaleX(1)}}

ul{list-style:none;margin:0;padding:0}
li{
  display:grid;grid-template-columns:clamp(28px,6vw,72px) 1fr;align-items:baseline;
  padding:clamp(12px,1.8vw,20px) 0;border-bottom:1px solid var(--rule);
}
li::before{content:"";width:100%;height:2px;background:var(--accent);transform:translateY(-.4em);
  max-width:28px;transition:max-width .3s ease}
li:hover::before{max-width:100%}
li p{
  margin:0;font-family:var(--serif);font-size:clamp(1.25rem,2.6vw,1.5rem);
  line-height:1.15;letter-spacing:-.01em;max-width:24ch;
}
footer{margin-top:clamp(36px,5vw,56px);color:var(--muted);font-size:.95rem;line-height:1.6;max-width:52ch}

@media (prefers-reduced-motion:reduce){
  .path::after{animation:none}
  li::before{transition:none}
}
</style>
</head>
<body>
<main>
  <header>
    <h1><span>Fearlessly</span> <span class="second">Forward Framework</span></h1>
    <div class="path" aria-hidden="true"></div>
  </header>
  <ul>
    <li><p>Expose our own and others’ bad behaviour.</p></li>
    <li><p>Own our mistakes and fix them.</p></li>
    <li><p>Hold everyone, including ourselves, accountable.</p></li>
    <li><p>Turn criticism into improvement.</p></li>
  </ul>
</main>
</body>
</html>
